# Tmux Window Icons
# Maps process names to Nerd Font icons for automatic window renaming.
#
# Format: icon = process_name
# Lines starting with # are comments.
# Blank lines are ignored.
#
# To add a new icon, just add a line like:
#    = bun
#
# Special rules (at the bottom):
#   ~version = icon label   — matches version-like commands (e.g. Claude Code)
#   ~default = icon         — fallback for unmatched processes

# Editors
 = nvim
 = vim

# Languages & Runtimes
 = node
 = python3
 = python

# Tools
 = git
 = lazygit
 = ssh
 = docker
 = cargo
 = ruby
 = go
 = make

# Shells
 = zsh
 = bash

# Special Rules
󱚣 = ~version claude
󱚣 = claude
 = ~default
